eureka:
  client:
    enabled: true   # "false" -> does not register to eureka server
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


#custom

cache:
  config:
    entryTtl: 60
    harbor-user:
      entryTtl: 30



rabbit-mq:
  queueName: crazy-harbor-bff-queue
  directExchangeProperty: crazy-harbor-bff-dirExchange
  routingKeyProperty: crazy-harbor-bff-routingKey
  replyTimeout: 10000
  receiveTimeout: 10000

async-executor-properties:
  corePoolSize: 5
  maxPoolSize: 20
  queueCapacity: 100
