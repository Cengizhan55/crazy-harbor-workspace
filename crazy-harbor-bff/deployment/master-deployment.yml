apiVersion: v1
kind: PersistentVolume
metadata:
  name: crazy-harbor-bff-pv-v2
  labels:
    app: crazy-harbor-bff-pod
    dummykey: dummyvalue
spec:
  storageClassName: manual
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /tmp/custom-spring-pv-v2

--- # IMPORTANT!! -> when we use pvc usually we also want to use "StatefulSet" object.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crazy-harbor-bff-pvc
  labels:
    app: crazy-harbor-bff-pod
    dummykey: dummyvalue
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: crazy-harbor-bff-secret-file
  labels:
    app: crazy-harbor-bff-pod
    dummykey: dummyvalue
#type: Opaque # öğren
data:
  SPRING_PROFILES_ACTIVE: live

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: crazy-harbor-bff-deployment
  labels:
    group: crazy-harbor-group
spec:
  selector:
    matchLabels:
      app: crazy-harbor-bff-pod
      dummykey: dummyvalue
  replicas: 2
  # number of pod instances we wanted , default is 1
  template: # pods that should be created as part of this deployment (--image)
    metadata:
      labels:
        app: crazy-harbor-bff-pod
        dummykey: dummyvalue
    spec: # we define how this POD should be configured
      containers:
        - name: crazy-harbor-bff-container
          image: cengizhandocker/crazy-harbor-bff:13062024-v9
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            failureThreshold: 25
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 150
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 150
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 10
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: crazy-harbor-bff-secret-file
          volumeMounts:
            - mountPath: /tmp/custom-spring-pv-v2
              name: crazy-harbor-bff-pv-v2

      volumes:
        - name: crazy-harbor-bff-pv-v2
          persistentVolumeClaim:
            claimName: crazy-harbor-bff-pvc








