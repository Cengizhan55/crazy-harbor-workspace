---

apiVersion: v1
kind: Service
metadata:
  name: crazy-harbor-bff-service
  labels:
    group: crazy-harbor-group
spec:
  type: LoadBalancer
  selector:
    app: crazy-harbor-bff-pod # key-value pair for labels of pods . we defined this metadata of deployment object.
  ports:
    - protocol: 'TCP'
      port: 8080 # this is service's port . Request -> service -> request -> pod  . . so it is arbitary port number
      targetPort: 8080 # this is when request comes which port the request will go from service to the pod ! . . so it is NOT arbitary port number. It is containers port number that goes to.
      nodePort: 31000

