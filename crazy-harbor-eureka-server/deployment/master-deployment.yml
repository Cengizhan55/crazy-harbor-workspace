apiVersion: apps/v1
kind: Deployment
metadata:
  name: crazy-harbor-eureka-deployment
  labels:
    group: crazy-harbor-group
spec:
  selector:
    matchLabels:
      app: crazy-harbor-eureka-pod
      dummykey: dummyvalue
  replicas: 1
  # number of pod instances we wanted , defult is 1
  template:                 # pods that should be created as part of this deployment (--image)
    metadata:
      labels:
        app: crazy-harbor-eureka-pod
        dummykey: dummyvalue
    spec:                 # we define how this POD should be configured
      containers:
        - name: crazy-harbor-eureka-container
          image: cengizhandocker/crazy-harbor-eureka-server:10062024-v2
         # env:
         #   - name: MY_SPECIAL_ENV
         #     valueFrom:
         #       configMapKeyRef:
         #         name: my-data-store-env           # this name is specified in configMap object as other resource
         #         key: my_folder                    # this name is specified in configMap object as other resource
          #volumeMounts:
          #  - name: my-volume-pv
          #    mountPath: /app/story
            #livenessProbe:
            #httpGet:
            #  path: /                                           # can be different(e.g /example - /health - /banana)
            #  port: 8765                                        # exposed container port
            #  httpHeaders:                                     # we can add headers too but no need.
            #periodSeconds: 20                                   # control frequency -> 20 seconds in this case.
          #initialDelaySeconds: 60                             # the time that k8 should checks the health for the first time. -> after the 60 second passed from the start, it checks the application.
         # imagePullPolicy: Always                               # this makes the pull the ":latest" tag image always. Also if you give that always you don't need to add tag end of the image name in the image definition above. (you can also set it to never)
      #volumes:
      #  - name: my-volume-pv
      #    persistentVolumeClaim:
      #      claimName: my-host-pvc                               # you can find the name in host-pvc .yaml

---

apiVersion: v1
kind: Service
metadata:
  name: crazy-harbor-eureka-server
  labels:
    group: crazy-harbor-group
spec:
  selector:
    app: crazy-harbor-eureka-pod
  ports:
    - protocol: 'TCP'
      port: 8761
      targetPort: 8761
  type: LoadBalancer

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: my-data-store-env
data:                                     # instead of spec we use data here.
  my_folder: 'my_key'                     # here is simple key-value pairs.

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-host-pvc
spec:
  volumeName: my-host-pv                          # which "PersistentVolume" we wanna use? we define here. We shouldnt claim with volumeName, we can also claim by resources. // it is Dynamic Volume Provisioning it is advance topic, we will go with static provisioning.
  storageClassName: standart                      # use same with the pv.yaml storageClassName
  accessModes:
    - ReadWriteOnce
  resources:                                      # which resources we want to get for this claim. counter part for pv.yaml capacity place.
    requests:
      storage: 1Gi

# we need to connect this persistent volume claim to the deployment.yaml !!

---

apiVersion: v1                                            # same as the service
kind: PersistentVolume
metadata:
  name: my-host-pv                                        # it is up to us. We can name anything we want
spec:
  capacity:
    storage: 1Gi                                          # 1 Gigabyte
  volumeMode: Filesystem                                  # there is 2 available modes here 1) FileSystem 2) Block
  storageClassName: standart                              # "standart"is the minikube automatic given named for minikube-hostpath
  accessModes:                                            # you can define multiple access modes. 3
    - ReadWriteOnce                                       # this volume can be mounted read-write volume by a single node, so by multiple pods but all have to be on same node. hostPath is given in this example and hostPath only available in this ReadWriteOnce case(minikube is one node working cluster, in real life multiple nodes will be.).
  #    - ReadOnlyMany                                       # it is read-only but can be claimed by multiple nodes. So different pods in different nodes can claim this same volume.For example hostPath cannot use this option because hostPath works healthy only in one node!.
  #    - ReadWriteMany                                      # it is same with the "ReadOnlyMany" with read-write access diference.
  hostPath:                                               # which type of volume we want
    path: /data
    type: DirectoryOrCreate


# https://kubernetes.io/docs/concepts/storage/persistent-volumes/