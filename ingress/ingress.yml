

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cengizhaner-website
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  defaultBackend: crazy-harbor-ui-service
  ingressClassName: nginx-example
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crazy-harbor-ui-service
                port:
                  number: 3000

